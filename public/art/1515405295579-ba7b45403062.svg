    </radialGradient>
    <radialGradient id="b2" cx="52.1%" cy="20.6%" r="75%">
      <stop offset="0%" stop-color="#7e83bf" stop-opacity="0.89"/>
      <stop offset="100%" stop-color="#7e83bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b3" cx="30.1%" cy="97.5%" r="75%">
      <stop offset="0%" stop-color="#2f3358" stop-opacity="0.86"/>
