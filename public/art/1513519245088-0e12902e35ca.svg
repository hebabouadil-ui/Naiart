      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.03" numOctaves="3" seed="87.65" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
