    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e2bd" stop-opacity="0.14"/>
      <stop offset="42%" stop-color="#f5e2bd" stop-opacity="0"/>
    </linearGradient>
  </defs>

