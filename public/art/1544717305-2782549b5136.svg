      <stop offset="100%" stop-color="#000" stop-opacity="0.38"/>
    </radialGradient>
    <linearGradient id="topGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e9cbb0" stop-opacity="0.14"/>
      <stop offset="42%" stop-color="#e9cbb0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="1250" fill="url(#ground)"/>
